apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: validador-final-uploads
  namespace: validador-final
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: validador-final-results
  namespace: validador-final
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: validador-final
  namespace: validador-final
spec:
  replicas: 2
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: validador-final
  template:
    metadata:
      labels:
        app: validador-final
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: api
          image: validador-final-api
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: validador-final-env
          env:
            - name: VALIDATOR_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: validador-final-bootstrap-admin
                  key: username
                  optional: true
            - name: VALIDATOR_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: validador-final-bootstrap-admin
                  key: password
                  optional: true
            - name: VALIDATOR_SETUP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: validador-final-bootstrap-admin
                  key: setup-token
                  optional: true
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: results
              mountPath: /app/results
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: validador-final-uploads
        - name: results
          persistentVolumeClaim:
            claimName: validador-final-results
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: validador-final-worker
  namespace: validador-final
spec:
  replicas: 2
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: validador-final-worker
  template:
    metadata:
      labels:
        app: validador-final-worker
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: validador-final-api
          imagePullPolicy: Always
          command:
            - python
            - -m
            - app.workers.validation_worker
          envFrom:
            - configMapRef:
                name: validador-final-env
          env:
            - name: VALIDATOR_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: validador-final-bootstrap-admin
                  key: username
                  optional: true
            - name: VALIDATOR_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: validador-final-bootstrap-admin
                  key: password
                  optional: true
            - name: VALIDATOR_SETUP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: validador-final-bootstrap-admin
                  key: setup-token
                  optional: true
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "from app.workers.validation_worker import build_validation_worker; build_validation_worker()"
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "from app.workers.validation_worker import build_validation_worker; build_validation_worker()"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: results
              mountPath: /app/results
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: validador-final-uploads
        - name: results
          persistentVolumeClaim:
            claimName: validador-final-results
