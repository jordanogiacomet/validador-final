apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: validador-final-uploads
  namespace: validador-final
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-client
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: validador-final-results
  namespace: validador-final
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-client
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: validador-final
  namespace: validador-final
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: validador-final
  template:
    metadata:
      labels:
        app: validador-final
    spec:
      containers:
        - name: api
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: VALIDATOR_FRONTEND_ORIGIN_REGEX
              value: "^https?://[^/]+:30092$"
            - name: VALIDATOR_SQLITE_PATH
              value: /app/results/operational.sqlite3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: results
              mountPath: /app/results
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: validador-final-uploads
        - name: results
          persistentVolumeClaim:
            claimName: validador-final-results
