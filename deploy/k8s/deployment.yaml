apiVersion: apps/v1
kind: Deployment
metadata:
  name: validador-final
  namespace: validador-final
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: validador-final
  template:
    metadata:
      labels:
        app: validador-final
    spec:
      containers:
        - name: api
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: results
              mountPath: /app/results
      volumes:
        - name: uploads
          emptyDir: {}
        - name: results
          emptyDir: {}
