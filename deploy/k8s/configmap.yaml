  VALIDATOR_FRONTEND_URL: ""
  VALIDATOR_FRONTEND_ORIGINS: ""
  VALIDATOR_FRONTEND_ORIGIN_REGEX: ""
  VALIDATOR_FRONTEND_API_BASE_URL: ""
