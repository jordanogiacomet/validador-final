[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-tenant-inventory-validator"
version = "0.1.0"
description = "Multi-tenant inventory validation platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
"fastapi[standard]",
"pydantic>=2",
"pydantic-settings>=2",
"prometheus_client",
"python-multipart",
"pandas",
"reportlab",
"pyyaml"
]

[project.optional-dependencies]
dev = [
"pytest",
"pytest-asyncio",
"httpx",
"ruff"
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
