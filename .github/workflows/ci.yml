name: CI

on:
  push:
    paths:
      - ".github/workflows/**"
      - "app/**"
      - "tests/**"
      - "frontend/**"
      - "deploy/**"
      - "pyproject.toml"
      - "README.md"
      - "Dockerfile"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "app/**"
      - "tests/**"
      - "frontend/**"
      - "deploy/**"
      - "pyproject.toml"
      - "README.md"
      - "Dockerfile"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Ruff
        run: ruff check app tests

      - name: Pytest
        run: pytest

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend lint
        run: npm run lint

      - name: Frontend tests
        run: npm run test

  smoke:
    name: Authenticated Smoke
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run authenticated smoke journey
        run: pytest tests/test_api.py -k authenticated_smoke_login_upload_and_fetch_result
