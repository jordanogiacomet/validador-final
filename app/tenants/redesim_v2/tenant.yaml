tenant_id: redesim_v2
display_name: RedeSim V2

csv:
  delimiter: ";"
  encoding: "iso-8859-1"

columns:
  item: item
  placa_anterior: item_anterior
  descricao: descricao
  marca: marca
  modelo: modelo
  ns: ns
  local: local
  cc: cc
  complemento: complemento
  observacao: observacao

enabled_rules:
  - duplicate_item
  - category_required_fields
  - category_critical_check

disabled_rules: []

thresholds: {}

categories:
  - name: mesa
    display_name: MESA
    keywords: ["mesa"]
    required_fields: ["complemento"]
    field_help:
      complemento: "02 tomadas 500x600x800"

  - name: prateleira
